<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="100%" height="100%">
  <rect width="256" height="256" fill="#f4ede2" rx="12" />
  <!-- QR Code pattern graphics -->
  <g fill="#14161d">
    <!-- Top Left Finder Pattern -->
    <rect x="24" y="24" width="56" height="56" rx="8" />
    <rect x="32" y="32" width="40" height="40" fill="#f4ede2" rx="4" />
    <rect x="40" y="40" width="24" height="24" rx="2" fill="#14161d" />

    <!-- Top Right Finder Pattern -->
    <rect x="176" y="24" width="56" height="56" rx="8" />
    <rect x="184" y="32" width="40" height="40" fill="#f4ede2" rx="4" />
    <rect x="192" y="40" width="24" height="24" rx="2" fill="#14161d" />

    <!-- Bottom Left Finder Pattern -->
    <rect x="24" y="176" width="56" height="56" rx="8" />
    <rect x="32" y="184" width="40" height="40" fill="#f4ede2" rx="4" />
    <rect x="40" y="192" width="24" height="24" rx="2" fill="#14161d" />

    <!-- Data Modules -->
    <rect x="96" y="24" width="16" height="16" rx="2" />
    <rect x="128" y="24" width="16" height="16" rx="2" />
    <rect x="96" y="56" width="16" height="16" rx="2" />
    <rect x="144" y="56" width="16" height="16" rx="2" />
    <rect x="112" y="88" width="16" height="16" rx="2" />
    <rect x="144" y="88" width="16" height="16" rx="2" />
    <rect x="176" y="88" width="16" height="16" rx="2" />

    <rect x="24" y="96" width="16" height="16" rx="2" />
    <rect x="56" y="96" width="16" height="16" rx="2" />
    <rect x="24" y="128" width="16" height="16" rx="2" />
    <rect x="56" y="144" width="16" height="16" rx="2" />

    <rect x="96" y="128" width="24" height="24" fill="#f0a84b" rx="4" />
    <rect x="136" y="128" width="24" height="24" fill="#00d2ff" rx="4" />

    <rect x="176" y="128" width="16" height="16" rx="2" />
    <rect x="208" y="128" width="16" height="16" rx="2" />
    <rect x="192" y="160" width="16" height="16" rx="2" />
    <rect x="96" y="176" width="16" height="16" rx="2" />
    <rect x="144" y="176" width="16" height="16" rx="2" />
    <rect x="112" y="208" width="16" height="16" rx="2" />
    <rect x="176" y="208" width="16" height="16" rx="2" />
    <rect x="208" y="208" width="16" height="16" rx="2" />
  </g>
</svg>
