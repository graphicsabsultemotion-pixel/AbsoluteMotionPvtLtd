    <path d="M240 0 V675 M480 0 V675 M720 0 V675 M960 0 V675" />
  </g>

  <!-- Tech Artwork: Servo Drive Waveforms & Robotic Arm Wireframe -->
  <g opacity="0.3" stroke="url(#redGlow)" fill="none">
    <path d="M100 500 Q 250 200 400 400 T 700 300 T 1000 500" stroke-width="4" />
    <circle cx="600" cy="337.5" r="180" stroke-width="2" stroke-dasharray="10,6" />
    <circle cx="600" cy="337.5" r="240" stroke-width="1" stroke-dasharray="20,10" />
  </g>

  <!-- Overlay Content Text -->
  <text x="60" y="560" font-family="'Outfit', sans-serif" font-weight="700" font-size="44" fill="#ffffff">
    Next-Gen Motion Control &amp; EV Powertrain Showcase
  </text>
  <text x="60" y="615" font-family="'Inter', sans-serif" font-weight="500" font-size="24" fill="#f0a84b">
